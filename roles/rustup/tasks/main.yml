---
# Install stable Rust.

- name: Fetch rustup script and store it in rustup_installer.content
  uri:
    url: https://sh.rustup.rs
    return_content: true
  register: rustup_installer

- name: Execute rustup script
  command:
    cmd: sh -s -- -y
    stdin: "{{ rustup_installer.content }}"
    creates: "{{ ansible_facts['env']['HOME'] }}/.cargo/bin/rustup"
