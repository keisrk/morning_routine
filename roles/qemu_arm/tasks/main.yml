---
#
- name: Ensure xPack default directory exists
  file:
    path: "{{ ansible_facts['env']['HOME'] }}/opt/xPacks"
    state: directory
    mode: "0755"

- name: Install QEMU Arm
  unarchive:
    src: https://github.com/xpack-dev-tools/qemu-arm-xpack/releases/download/v9.2.4-1/xpack-qemu-arm-9.2.4-1-linux-x64.tar.gz
    dest: "{{ ansible_facts['env']['HOME'] }}/opt/xPacks"
    remote_src: true
