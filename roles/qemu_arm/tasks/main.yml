---
#
- name: Ensure xPack default directory exists
  file:
    path: "{{ ansible_facts['env']['HOME'] }}/opt/xPacks"
    state: directory
    mode: "0755"

- name: Install QEMU Arm
  unarchive:
    src: "https://github.com/xpack-dev-tools/qemu-arm-xpack/releases/download/\
      v{{ qemu_arm_version }}/xpack-qemu-arm-{{ qemu_arm_version }}-linux-\
      {{ qemu_arm_arch_map[ansible_facts['architecture']] | default('x64') }}.tar.gz"
    dest: "{{ ansible_facts['env']['HOME'] }}/opt/xPacks"
    remote_src: true
