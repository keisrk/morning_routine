# GDB for 32-bit Arm arch cannot be obtained from the package manager. Download
# all the utilities from Arm Developer website.
---

- name: Install utilities
  apt:
    name: openocd, screen, clang-format

- name: Download file for bare-metal target with check (sha256)
  get_url:
    url: "https://gitlab.arm.com/api/v4/projects/tooling%2Fgnu-toolchains-for-arm/packages/generic/\
      gnu-toolchain/15.3.rel2/arm-gnu-toolchain-15.3.rel2-x86_64-arm-none-eabi.tar.xz"
    dest: /tmp/arm-gnu-toolchain-15.3.rel2-x86_64-arm-none-eabi.tar.xz
    checksum: sha256:463df9665c246fa13bab2102115bbf83440661b6eb70b44f3dfd4712ca30037a
    mode: "0644"

- name: Extract files for bare-metal target
  unarchive:
    src: /tmp/arm-gnu-toolchain-15.3.rel2-x86_64-arm-none-eabi.tar.xz
    dest: /usr/local

- name: Download file for linux-based target (Raspberry Pi)
  get_url:
    url: "https://gitlab.arm.com/api/v4/projects/tooling%2Fgnu-toolchains-for-arm/packages/generic/\
      gnu-toolchain/15.3.rel2/arm-gnu-toolchain-15.3.rel2-x86_64-arm-none-linux-gnueabihf.tar.xz"
    dest: /tmp/arm-gnu-toolchain-15.3.rel2-x86_64-arm-none-linux-gnueabihf.tar.xz
    checksum: sha256:3f232016d84c06b35ef02d08ef9d94e2ff1f77e04b82d665f95c6baf1b640660
    mode: "0644"

- name: Extract files for linux-based target
  unarchive:
    src: /tmp/arm-gnu-toolchain-15.3.rel2-x86_64-arm-none-linux-gnueabihf.tar.xz
    dest: /usr/local
