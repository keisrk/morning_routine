# GDB for 32-bit Arm arch cannot be obtained from the package manager. Download
# all the utilities from Arm Developer website.
---

- name: Install utilities
  apt:
    name: openocd, screen, clang-format

- name: Download file for bare-metal target with check (sha256)
  get_url:
    url: "https://gitlab.arm.com/api/v4/projects/tooling%2Fgnu-toolchains-for-arm/packages/generic/\
      gnu-toolchain/{{ arm_embedded_version }}/\
      arm-gnu-toolchain-{{ arm_embedded_version }}-{{ ansible_facts['architecture'] }}-arm-none-eabi.tar.xz"
    dest: "/tmp/arm-gnu-toolchain-{{ arm_embedded_version }}-{{ ansible_facts['architecture'] }}-arm-none-eabi.tar.xz"
    checksum: "{{ arm_embedded_checksums[ansible_facts['architecture']]['arm-none-eabi'] }}"
    mode: "0644"

- name: Extract files for bare-metal target
  unarchive:
    src: "/tmp/arm-gnu-toolchain-{{ arm_embedded_version }}-{{ ansible_facts['architecture'] }}-arm-none-eabi.tar.xz"
    dest: /usr/local
    remote_src: true

- name: Remove downloaded bare-metal tarball
  file:
    path: "/tmp/arm-gnu-toolchain-{{ arm_embedded_version }}-{{ ansible_facts['architecture'] }}-arm-none-eabi.tar.xz"
    state: absent

- name: Download file for linux-based target (Raspberry Pi)
  get_url:
    url: "https://gitlab.arm.com/api/v4/projects/tooling%2Fgnu-toolchains-for-arm/packages/generic/\
      gnu-toolchain/{{ arm_embedded_version }}/\
      arm-gnu-toolchain-{{ arm_embedded_version }}-{{ ansible_facts['architecture'] }}-arm-none-linux-gnueabihf.tar.xz"
    dest: "/tmp/arm-gnu-toolchain-{{ arm_embedded_version }}-{{ ansible_facts['architecture'] }}-arm-none-linux-gnueabihf.tar.xz"
    checksum: "{{ arm_embedded_checksums[ansible_facts['architecture']]['arm-none-linux-gnueabihf'] }}"
    mode: "0644"

- name: Extract files for linux-based target
  unarchive:
    src: "/tmp/arm-gnu-toolchain-{{ arm_embedded_version }}-{{ ansible_facts['architecture'] }}-arm-none-linux-gnueabihf.tar.xz"
    dest: /usr/local
    remote_src: true

- name: Remove downloaded linux-based tarball
  file:
    path: "/tmp/arm-gnu-toolchain-{{ arm_embedded_version }}-{{ ansible_facts['architecture'] }}-arm-none-linux-gnueabihf.tar.xz"
    state: absent
