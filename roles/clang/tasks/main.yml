---
# Clang C/C++ compiler toolchain

# LLVM repo
- name: Add LLVM toolchain APT repository
  deb822_repository:
    name: llvm-toolchain-20
    types: deb
    uris: "https://apt.llvm.org/{{ ansible_facts['distribution_release'] | lower }}/"
    signed_by: "https://apt.llvm.org/llvm-snapshot.gpg.key"
    suites: "llvm-toolchain-{{ ansible_facts['distribution_release'] | lower }}-20"
    components: main

- name: Install Clang and C/C++ development packages
  apt:
    update_cache: true
    name:
      - clang-20
      - libc++-20-dev
      - libc++abi-20-dev
      - libcurl4-openssl-dev
      - libsqlite3-dev
      - pkgconf
    state: present

- name: Download and install CBMC
  apt:
    deb: "https://github.com/diffblue/cbmc/releases/download/cbmc-{{ clang_cbmc_version }}/\
      ubuntu-24.04{{ clang_cbmc_arch_map[ansible_facts['architecture']] | default('') }}-\
      cbmc-{{ clang_cbmc_version }}-Linux.deb"
    state: present
