---

- name: Fetch nvm installer script
  ansible.builtin.uri:
    url: https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.4/install.sh
    return_content: true
  register: nvm_installer

- name: Install nvm
  ansible.builtin.command:
    cmd: bash
    stdin: "{{ nvm_installer.content }}"
    creates: "{{ ansible_env.HOME }}/.nvm/nvm.sh"
