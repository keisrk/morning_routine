---
# Python 3 environment

- name: Create Python 3 venv dir
  file:
    path: "{{ ansible_facts['env']['HOME'] }}/python_projects"
    state: directory
    mode: "0755"

- name: Install Python development packages
  pip:
    name:
      - ansible
      - ansible-lint
      - sphinx
      - restview
      - rst2beamer3k
      - meson
      - ninja
      - ipython
      - black
    virtualenv: "{{ ansible_facts['env']['HOME'] }}/python_projects"
    virtualenv_command: python3 -m venv
  environment:
    PATH: "{{ ansible_facts['env']['PATH'] }}:{{ ansible_facts['env']['HOME'] }}/.local/bin"
